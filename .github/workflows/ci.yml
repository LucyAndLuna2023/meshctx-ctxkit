name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with paid extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest tests/ -q
        env:
          PYTHONPATH: src

  # Audit finding 3.2: "74 tests green" coexisted with "a paying customer on a
  # clean install gets tier: free", because the suite ran against a system
  # Python that already had PyJWT. This job proves the real install experience.
  clean-install:
    name: clean install matrix (free / license / collision)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Free tier must work with ZERO dependencies
        run: |
          TARGET=$(mktemp -d)
          python -m pip install --target "$TARGET" --no-deps dist/*.whl
          PYTHONPATH="$TARGET" PYTHONNOUSERSITE=1 python -S -c "
          import tempfile
          from meshctx_ctxkit.memory import MemoryStore
          from meshctx_ctxkit.consensus import run_offline_checks
          s = MemoryStore(root=tempfile.mkdtemp())
          s.remember('ci clean install probe')
          assert s.recall('probe')
          assert run_offline_checks('2 * 3 = 7')['verdict'] == 'suspicious'
          print('free tier OK with zero dependencies')
          "

      - name: Missing PyJWT must fail loudly with the right hint
        run: |
          TARGET=$(ls -d /tmp/tmp.* 2>/dev/null | head -1)
          TARGET=$(mktemp -d)
          python -m pip install --target "$TARGET" --no-deps dist/*.whl
          OUT=$(PYTHONPATH="$TARGET" PYTHONNOUSERSITE=1 python -S -c "
          from meshctx_ctxkit.license import verify_license
          print(verify_license('a.b.c').reason)
          ")
          echo "$OUT"
          echo "$OUT" | grep -q "meshctx-ctxkit\[license\]" || {
            echo "FAIL: error must name the correct extra to install"; exit 1; }

      - name: Paid licence must activate on a clean install
        run: |
          # Two things this step must get right:
          #
          # 1. Import the INSTALLED wheel, not src/. Setting PYTHONPATH=src
          #    here would re-test the source tree and prove nothing — which is
          #    exactly the failure mode that let a broken paid tier ship.
          # 2. Use a throwaway keypair via CTXKIT_LICENSE_PUBKEY, because the
          #    public key baked into the package belongs to the (private)
          #    billing service and cannot be used to sign a test licence.
          TARGET=$(mktemp -d)
          python -m pip install --target "$TARGET" --no-deps dist/*.whl
          python -m pip install --target "$TARGET" --upgrade "pyjwt[crypto]"

          PYTHONPATH="$TARGET" PYTHONNOUSERSITE=1 python -S - <<'PY'
          import os, tempfile
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          import meshctx_ctxkit.license as L

          k = Ed25519PrivateKey.generate()
          priv = k.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()).decode()
          pub = k.public_key().public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo).decode()

          tok = L.sign_license(priv, tier="pro", email="ci@test", days=1)

          # (a) verify with the throwaway public key
          lic = L.verify_license(tok, pub)
          assert lic.tier == "pro", f"expected pro, got {lic.tier}: {lic.reason}"
          assert lic.active, lic.reason

          # (b) load it from disk the way a real user stores it.
          #     CTXKIT_HOME *is* the data directory (same place as memory.jsonl).
          home = tempfile.mkdtemp()
          Path(home, "license.key").write_text(tok)
          os.environ["CTXKIT_HOME"] = home
          os.environ["CTXKIT_LICENSE_PUBKEY"] = pub
          lic2 = L.load_license_from_env()
          assert lic2.tier == "pro" and lic2.active, lic2.reason
          print("paid licence activates on clean install (installed wheel)")
          PY

      - name: A licence signed by another key must be rejected
        run: |
          TARGET=$(mktemp -d)
          python -m pip install --target "$TARGET" --no-deps dist/*.whl
          python -m pip install --target "$TARGET" --upgrade "pyjwt[crypto]"
          PYTHONPATH="$TARGET" PYTHONNOUSERSITE=1 python -S - <<'PY'
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from meshctx_ctxkit.license import sign_license, verify_license

          rogue = Ed25519PrivateKey.generate()
          priv = rogue.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()).decode()
          forged = sign_license(priv, tier="team", email="evil@x", days=9999)
          lic = verify_license(forged)   # uses the package's baked-in key
          assert lic.tier == "free", "a token signed by another key must not grant a tier"
          print("rogue-signed licence correctly rejected")
          PY

      - name: Must not shadow the unrelated PyPI `ctxkit` package
        run: |
          TARGET=$(mktemp -d)
          python -m pip install --target "$TARGET" --no-deps dist/*.whl
          PYTHONPATH="$TARGET" PYTHONNOUSERSITE=1 python -S -c "
          import importlib.util as u
          assert u.find_spec('meshctx_ctxkit'), 'our package must import'
          assert u.find_spec('ctxkit') is None, 'must not ship top-level ctxkit'
          print('no namespace collision')
          "
          test -f "$TARGET/bin/meshctx-ctxkit" || {
            echo "FAIL: console script missing"; exit 1; }
          test ! -e "$TARGET/bin/ctxkit" || {
            echo "FAIL: must not install a colliding ctxkit script"; exit 1; }
